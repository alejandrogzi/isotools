[workspace]
members = [
    "iso-intron",
    "iso-utr",
    "iso-fusion",
    "iso-classify",
    "iso-nmd",
    "iso-orphan",
    "iso-segment",
    "iso-pas",
    "iso-cigar",
    "iso-adapter",
    "iso-align",
]
resolver = "2"

[workspace.package]
authors = ["alejandrogzi <alejandrxgzi@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.70.0"
version = "0.0.35"

[workspace.dependencies]
dashmap = { version = "6", features = ["rayon"] }
clap = { version = "^4.0", features = ["derive"] }
rayon = "1.8.1"
num_cpus = "1.16.0"
hashbrown = { version = "0.17", features = ["rayon", "serde"] }
anyhow = "1.0.98"
serde = { version = "1.0.210", features = ["derive", "rc"] }
rand = "0.8.5"
log = "0.4.29"
simple_logger = "5.0.0"
thiserror = "2.0"
petgraph = "0.8.3"
tempfile = "3.13.0"
serde_json = "1.0.133"
num-traits = "0.2.19"
bigtools = "=0.5.4"
twobit = "0.2.2"
tokio = { version = "1.16", features = ["full"] }
bio = "3.0.0"
ndarray = "0.16.1"
noodles-bam = "0.79.0"
noodles-bgzf = "0.39.0"
noodles-core = "0.17.0"
noodles-sam = "0.75.0"
noodles-csi = "0.47.0"
memchr = "2.7.4"
memmap2 = "0.9.4"
genepred = { version = "0.0.11", features = ["mmap", "rayon", "gzip"] }
packbed = { version = "0.0.13", features = ["dashmap"] }
rust-lapper = "1.2.0"
crossbeam-channel = "0.5.15"
flate2 = { version = "1.1.9", features = ["rust_backend"], default-features = false }
aho-corasick = "1.1"
triple_accel = "0.4"
needletail = "0.6"
rustc-hash = "2"
smallvec = "1"


[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
